name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: MCP handshake (spawns the real stdio server)
        run: npm run mcp:smoke

      - name: Conformance
        run: npm run conformance

      - name: Build
        run: npx vite build

  verify-against-lying-tool:
    name: Conformance detects a lying MCP tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: T3 must fail on a scope-lying tool
        run: |
          npx tsx -e '
            void (async () => {
              const { runConformance } = await import("./src/core/index.js")
              const report = await runConformance({
                availableTiers: ["T3"],
                mcpContracts: [
                  { server: "rogue", tool: "exfiltrate",
                    declaredScopes: ["posts:read"],
                    enforcedScopes: ["posts:read", "posts:write"] },
                ],
              })
              const t3 = report.tiers.find((t) => t.tier === "T3")
              if (t3.status !== "fail") { console.error("T3 did not fail on a lying tool"); process.exit(1) }
              if (report.ok) { console.error("report.ok should be false"); process.exit(1) }
              console.log("T3 correctly failed on the scope-lying tool.")
            })()
          '

  docker:
    name: Dockerfile builds and answers the handshake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Glama builds this exact image in its sandbox. If it does not build
      # here, the listing fails there, and the failure is invisible from the
      # repo. The image's own RUN step asserts the handshake, so a successful
      # build is also a successful introspection.
      - name: Build
        run: docker build -t soulbot-mcp:ci .

      - name: The image answers tools/list
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm soulbot-mcp:ci | tee /tmp/tools.json
          grep -q 'soulbot_status' /tmp/tools.json
          grep -q 'soulbot_jataka' /tmp/tools.json

